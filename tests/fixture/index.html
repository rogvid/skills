<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Ops — fixture app</title>
<style>
  :root {
    --bg: #f5f6f9;
    --surface: #ffffff;
    --ink: #171c28;
    --ink-soft: #5b6478;
    --line: #e3e6ee;
    --accent: #eb6e14;
    --good: #1f8a5c;
    --warn: #b4791a;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1040px; margin: 0 auto; padding: 34px 40px 56px; }

  /* Hero ------------------------------------------------------------- */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  h1 { margin: 0; font-size: 30px; letter-spacing: -0.02em; font-weight: 700; }
  .sub { margin: 6px 0 0; color: var(--ink-soft); font-size: 15px; }
  #status {
    font: 600 13px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--ink-soft); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px;
    white-space: nowrap;
  }

  /* KPI cards -------------------------------------------------------- */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 26px 0 22px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px 20px;
  }
  .kpi .label {
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-soft);
  }
  .kpi .value { margin-top: 8px; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .kpi .delta { margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--good); }
  .kpi .delta.down { color: var(--warn); }

  /* Toolbar ---------------------------------------------------------- */
  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  #search {
    flex: 1; padding: 11px 14px; font: inherit; color: inherit;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; outline: none;
  }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(235, 110, 20, 0.14); }
  #refresh {
    padding: 11px 20px; font: 600 15px/1 inherit; color: #fff;
    background: var(--accent); border: 0; border-radius: 10px; cursor: pointer;
  }
  #refresh:hover { filter: brightness(1.06); }
  /* Keyboard focus, made unmistakable. Chromium draws its own ring on a
     Tab-focused button, but its colour and width are the UA's to change; this
     is the fixture stating what `press("Tab")` is supposed to look like.
     `:focus-visible`, not `:focus`, so a mouse click on Refresh — which the
     web take does, and photographs — still draws no ring at all. `outline`
     takes no space, so nothing on the page moves. */
  #refresh:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* Table ------------------------------------------------------------ */
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 13px 20px; text-align: left; }
  thead th {
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
  }
  tbody tr + tr td { border-top: 1px solid var(--line); }
  td.num { font-variant-numeric: tabular-nums; }
  .pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    background: rgba(31, 138, 92, 0.12); color: var(--good);
  }
  .pill.hold { background: rgba(180, 121, 26, 0.14); color: var(--warn); }
  #empty { padding: 26px 20px; color: var(--ink-soft); }

  /* Entropy panel (only with ?entropy=1) ------------------------------ */
  /* The two things a re-recording is allowed to differ by, made large and
     high-contrast on purpose: a wall clock and a running animation. With
     determinism on they are pinned and two takes match pixel for pixel;
     with it off they are what makes them not. See issue #10. */
  #entropy-panel {
    margin-bottom: 22px; padding: 14px 20px; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    display: flex; align-items: center; gap: 22px;
  }
  #entropy-readings {
    flex: 1;
    font: 700 22px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: -0.01em; color: var(--ink);
  }
  #entropy-readings div { white-space: nowrap; }
  @keyframes entropy-spin { to { transform: rotate(360deg); } }
  #entropy-spinner {
    width: 54px; height: 54px; flex: 0 0 auto;
    background: var(--ink);
    /* Deliberately asymmetric: a rotating disc would look identical at every
       angle and prove nothing about animation phase. */
    clip-path: polygon(50% 0, 100% 100%, 50% 72%, 0 100%);
    animation: entropy-spin 1.7s linear infinite;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <h1>Northwind Ops</h1>
      <p class="sub">Fulfilment overview for the western region.</p>
    </div>
    <div id="status">snapshot 1 of 3</div>
  </header>

  <section class="kpis">
    <div class="kpi">
      <div class="label">Revenue</div>
      <div class="value" id="kpi-rev">$128,400</div>
      <div class="delta" id="kpi-rev-delta">+4.2% vs. last week</div>
    </div>
    <div class="kpi">
      <div class="label">Open orders</div>
      <div class="value" id="kpi-orders">42</div>
      <div class="delta" id="kpi-orders-delta">+6 today</div>
    </div>
    <div class="kpi">
      <div class="label">On-time rate</div>
      <div class="value" id="kpi-ontime">96%</div>
      <div class="delta" id="kpi-ontime-delta">+1 pt</div>
    </div>
  </section>

  <div class="toolbar">
    <input id="search" type="text" placeholder="Filter orders by customer or city…" autocomplete="off">
    <button id="refresh" type="button">Refresh</button>
  </div>

  <div class="card">
    <table id="table">
      <thead>
        <tr>
          <th>Order</th>
          <th>Customer</th>
          <th>City</th>
          <th>Status</th>
          <th class="num">Total</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" hidden>No orders match that filter.</div>
  </div>
</div>

<script>
"use strict";
/*
 * Fixture app for the demo-video smoke test. Deliberately dependency-free,
 * build-step-free, and deterministic: no Math.random(), no Date.now() on
 * screen, no animations. Every element the smoke test (and the queued
 * feature work) drives has a stable id.
 *
 * Keyboard behaviour, always on (issue #130 — the recorder's `press()` and
 * `clear()` verbs need something to drive that a mouse cannot reach):
 *   Enter in #search   submits the toolbar, which here means what the Refresh
 *                      button means — advance to the next snapshot
 *   Escape anywhere    empties #search and takes focus off it, the way a
 *                      search field's dismiss key does
 *   Tab from #search   moves focus to #refresh, which draws a ring (CSS above)
 * None of them is a query-string hook: a form demo is the ordinary case, not
 * a broken-app case.
 *
 * Query-string hooks, inert unless asked for:
 *   ?console-error=1  page logs a console error and throws on load (issue #3)
 *   ?bad-fetch=<url>  page fetches a missing path and <url>, both on load,
 *                     so the failures land during the recorder's goto (#3)
 *   ?entropy=1        renders four clock readings (Date, Intl, the Date
 *                     constructor, and one posted back by a Worker) and a
 *                     spinning shape — what determinism pins down (issue #10)
 *   ?evidence=1       renders one element carrying value-bearing attributes
 *                     the page never paints, beside text it does — what a
 *                     *text* account of a page can hold that a picture of it
 *                     cannot (issue #9)
 */

// Three fixed snapshots. #refresh cycles through them in order, so a
// recording made today looks exactly like one made next year.
var SNAPSHOTS = [
  {
    kpis: { rev: "$128,400", revDelta: "+4.2% vs. last week", revDown: false,
            orders: "42", ordersDelta: "+6 today",
            ontime: "96%", ontimeDelta: "+1 pt", ontimeDown: false },
    rows: [
      ["NW-1041", "Ferrari Logistics", "Portland", "shipped", "$4,280"],
      ["NW-1042", "Blue Ridge Foods",  "Boise",    "shipped", "$1,915"],
      ["NW-1043", "Harbor Supply Co.", "Seattle",  "hold",    "$8,640"],
      ["NW-1044", "Cascade Outfitters","Portland", "shipped", "$2,370"],
      ["NW-1045", "Pine & Poplar",     "Spokane",  "shipped", "$980"]
    ]
  },
  {
    kpis: { rev: "$134,950", revDelta: "+9.3% vs. last week", revDown: false,
            orders: "38", ordersDelta: "-4 today",
            ontime: "97%", ontimeDelta: "+2 pt", ontimeDown: false },
    rows: [
      ["NW-1046", "Harbor Supply Co.", "Seattle",  "shipped", "$6,120"],
      ["NW-1047", "Ferrari Logistics", "Portland", "shipped", "$3,410"],
      ["NW-1048", "Redwood Kitchens",  "Eugene",   "hold",    "$5,275"],
      ["NW-1049", "Blue Ridge Foods",  "Boise",    "shipped", "$2,040"]
    ]
  },
  {
    kpis: { rev: "$119,180", revDelta: "-2.1% vs. last week", revDown: true,
            orders: "51", ordersDelta: "+13 today",
            ontime: "93%", ontimeDelta: "-3 pt", ontimeDown: true },
    rows: [
      ["NW-1050", "Cascade Outfitters","Portland", "hold",    "$7,860"],
      ["NW-1051", "Pine & Poplar",     "Spokane",  "shipped", "$1,240"],
      ["NW-1052", "Harbor Supply Co.", "Seattle",  "shipped", "$3,990"],
      ["NW-1053", "Redwood Kitchens",  "Eugene",   "shipped", "$2,615"],
      ["NW-1054", "Ferrari Logistics", "Portland", "hold",    "$9,105"],
      ["NW-1055", "Blue Ridge Foods",  "Boise",    "shipped", "$1,730"]
    ]
  }
];

var snapshotIndex = 0;

function el(id) { return document.getElementById(id); }

function renderKpis(k) {
  el("kpi-rev").textContent = k.rev;
  el("kpi-rev-delta").textContent = k.revDelta;
  el("kpi-rev-delta").className = k.revDown ? "delta down" : "delta";
  el("kpi-orders").textContent = k.orders;
  el("kpi-orders-delta").textContent = k.ordersDelta;
  el("kpi-ontime").textContent = k.ontime;
  el("kpi-ontime-delta").textContent = k.ontimeDelta;
  el("kpi-ontime-delta").className = k.ontimeDown ? "delta down" : "delta";
}

function renderRows() {
  var snap = SNAPSHOTS[snapshotIndex];
  var needle = el("search").value.trim().toLowerCase();
  var body = el("rows");
  body.textContent = "";
  var shown = 0;
  for (var i = 0; i < snap.rows.length; i++) {
    var r = snap.rows[i];
    var haystack = (r[1] + " " + r[2]).toLowerCase();
    if (needle && haystack.indexOf(needle) === -1) { continue; }
    var tr = document.createElement("tr");
    tr.id = "row-" + r[0].toLowerCase();
    tr.innerHTML =
      "<td>" + r[0] + "</td>" +
      "<td>" + r[1] + "</td>" +
      "<td>" + r[2] + "</td>" +
      '<td><span class="pill' + (r[3] === "hold" ? " hold" : "") + '">' + r[3] + "</span></td>" +
      '<td class="num">' + r[4] + "</td>";
    body.appendChild(tr);
    shown++;
  }
  el("empty").hidden = shown > 0;
}

function render() {
  var snap = SNAPSHOTS[snapshotIndex];
  el("status").textContent = "snapshot " + (snapshotIndex + 1) + " of " + SNAPSHOTS.length;
  renderKpis(snap.kpis);
  renderRows();
}

function advance() {
  snapshotIndex = (snapshotIndex + 1) % SNAPSHOTS.length;
  render();
}

el("search").addEventListener("input", renderRows);
el("refresh").addEventListener("click", advance);

// Enter in the search box does what the toolbar's button does. Deliberately
// the same code path, so a demo that submits with the keyboard and one that
// clicks are demonstrably the same action and not two things that agree.
el("search").addEventListener("keydown", function (e) {
  if (e.key !== "Enter") { return; }
  e.preventDefault();
  advance();
});

// Escape dismisses the search, from wherever the focus happens to be — which
// is the point of a dismiss key, and the reason the recorder's press() takes
// no selector. Blurring as well as emptying is what separates this from what
// clear() does, so neither can pass an assertion meant for the other.
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") { return; }
  el("search").value = "";
  el("search").blur();
  renderRows();
});

render();

// -- query-string hooks -----------------------------------------------------

var params = new URLSearchParams(window.location.search);

if (params.has("bad-fetch")) {
  // Deliberate network breakage for the failed-request detection work
  // (issue #3). Two shapes: a response the server answers with 404, and a
  // request that never gets a response at all — the caller passes a URL on a
  // port nothing is listening on, since a dead port cannot be hardcoded.
  //
  // Fired here, during page load, on purpose: the recorder's goto() is still
  // open, so these have a beat to be attributed to. Driving them from the
  // storyboard instead would fire them between beats, where the honest
  // answer is "no beat" and there is nothing to check attribution against.
  fetch("/definitely-missing.json").catch(function () {});
  var refused = params.get("bad-fetch");
  if (refused && refused !== "1") { fetch(refused).catch(function () {}); }
}

if (params.has("entropy")) {
  // Everything a second take of the same storyboard would otherwise render
  // differently (issue #10). Each clock is read once, at load: a ticking one
  // would also keep the compositor painting, which would confound the very
  // measurement this panel exists for. Deliberately NOT here: Math.random().
  // The recorder cannot seed an app's RNG, and pretending otherwise by
  // seeding it in the fixture would test a control that does not exist.
  //
  // Four different ways of asking what time it is, because they are four
  // different clocks under the hood and patching the Date global reaches only
  // the first. Each one of the others was a hole found open in review: Intl
  // formats from its own internal clock, a Worker gets its own global that
  // page init scripts never run in, and `new Date().constructor` walked
  // straight past a proxied global to the real constructor.
  var entropy = document.createElement("div");
  entropy.id = "entropy-panel";
  var readings = document.createElement("div");
  readings.id = "entropy-readings";

  var clock = document.createElement("div");
  clock.id = "entropy-clock";
  clock.textContent = new Date().toLocaleString() + " · " + Date.now();

  var intl = document.createElement("div");
  intl.id = "entropy-intl";
  intl.textContent = "intl " + new Intl.DateTimeFormat("en-US", {
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", timeZone: "UTC"
  }).format();

  var ctor = document.createElement("div");
  ctor.id = "entropy-ctor";
  ctor.textContent = "ctor " + new Date().constructor.now()
    + " · same " + (Date.prototype.constructor === Date);

  var worker = document.createElement("div");
  worker.id = "entropy-worker";
  worker.textContent = "worker …";
  try {
    var w = new Worker("entropy-worker.js");
    w.onmessage = function (e) {
      worker.textContent = "worker " + e.data;
      worker.className = "ready";
      w.terminate();
    };
  } catch (err) {
    worker.textContent = "worker unavailable";
    worker.className = "ready";
  }

  var spinner = document.createElement("div");
  spinner.id = "entropy-spinner";
  readings.appendChild(clock);
  readings.appendChild(intl);
  readings.appendChild(ctor);
  readings.appendChild(worker);
  entropy.appendChild(readings);
  entropy.appendChild(spinner);
  // Prepended, not appended: four readings and a 54px spinner are tall enough
  // that at the bottom of the page they fall below the 720px fold, and a
  // shot() captures the viewport, not the full page. A panel nobody can
  // photograph makes every comparison in tests/smoke pass for the wrong
  // reason — measured, as two byte-identical stills of a spinning shape.
  document.querySelector(".page").prepend(entropy);
}

if (params.has("evidence")) {
  // Per-beat evidence (issue #9) is a *text* account of the page, so it can
  // carry strings that were never on anybody's screen. This view renders one
  // element of that shape: visible text, plus two attributes holding values
  // the page never paints — one plain, one a JSON blob, because those reach
  // the serializer through the same getAttribute() path but read differently
  // to a human.
  //
  // The panel used to hold thirty more elements. They were the leak shapes the
  // masking assertions swept for, and they went with the mask (#142, #144):
  // 30 of the 31 ids here had no reader left in tests/smoke. What remains is
  // what `run_evidence` names — this element's markup, and the text it
  // renders, which is the control proving the absence assertions are not
  // holding trivially over an empty capture.
  //
  // The values are `zz-` shaped rather than credential-shaped. The assertions
  // grade the attribute *names*, so the shape is free, and a value that looked
  // like a key would only earn back a .gitleaks.toml allowlist entry.
  var ev = document.createElement("div");
  ev.id = "ev-panel";
  ev.style.cssText =
    "position:fixed;top:8px;left:8px;width:520px;z-index:5;background:#fff;" +
    "border:1px solid #d8d2c6;border-radius:8px;padding:8px 10px;" +
    "font:12px/1.5 ui-monospace,monospace;color:#1c1a17;";
  ev.innerHTML =
    '<div id="ev-spot-attrs" data-token="zz-attr-00000000"\n' +
    '  data-cfg=\'{"key":"zz-json-00000000"}\'>nothing rendered here</div>';
  document.body.appendChild(ev);
}

if (params.has("console-error")) {
  // Deliberate breakage for the console-error detection work (issue #3).
  // Emits both shapes a detector might key on: a console.error record and
  // an uncaught exception (Playwright's "pageerror"). Thrown from a task so
  // the rest of this script still finishes and the page stays usable.
  console.error("fixture: deliberate console error");
  setTimeout(function () {
    throw new Error("fixture: deliberate uncaught error");
  }, 0);
}
</script>
</body>
</html>

# Tooling and task front door for this repo.
#
#     mise run bootstrap   # once per clone: tools and git hooks
#     mise run check       # lint and unit tests, a few seconds
#     mise tasks           # everything else

[tools]
uv = "latest"
prek = "latest"
gitleaks = "latest"

[env]
RUFF = "ruff@0.16.1"

[tasks.bootstrap]
description = "Once per clone: git hooks, and a report on what recording needs"
run = [
  "prek install",
  '''
  command -v ffmpeg > /dev/null 2>&1 || echo "MISSING  ffmpeg - sudo apt-get install -y ffmpeg"
  cache="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
  [ -d "$cache" ] || cache="$HOME/Library/Caches/ms-playwright"
  ls -d "$cache"/chromium* > /dev/null 2>&1 || echo "MISSING  Chromium - uv run --with playwright playwright install chromium"
  echo "bootstrap: done"
  ''',
]

[tasks.lint]
description = "ruff check and format check"
run = "tests/lint"

[tasks.test]
description = "Unit tests for the recorder's pure parts"
run = "uv run --no-project --with pytest --with pillow pytest -q tests"

[tasks.check]
description = "lint and unit tests"
depends = ["lint", "test"]

[tasks.example]
description = "Record the ticket-queue example demo (needs ffmpeg and Chromium)"
run = "examples/ticket-queue/demo/record.sh"

[tasks.showcase]
description = "Record the README's showcase video (narrated when .env has ELEVENLABS_API_KEY)"
run = "examples/showcase/record.sh"

[tasks.ticket-queue]
description = "The ticket-queue example's own browser suite"
dir = "examples/ticket-queue"
run = "./test"

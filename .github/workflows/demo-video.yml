name: Demo video

# Record the demos a branch made stale and publish them to its pull request.
#
# This is a *reusable* workflow. A consuming repository calls it in a few lines:
#
#   jobs:
#     demo:
#       permissions:
#         contents: write  # the preview's release-asset upload (#410)
#         pull-requests: write
#         issues: read     # so the ticket re-read (#276) can fetch the issue;
#                          # without it that check reports `not checked`
#       uses: rogvid/skills/.github/workflows/demo-video.yml@main
#       with:
#         working-directory: examples/ticket-queue
#         app-command: ./serve --port 8901
#         base-url: http://127.0.0.1:8901
#
# and gets a short block spliced into the pull-request body, rewritten on every
# push: what kind of change this is, one sentence, the demo, and the acceptance
# clauses as a checklist.
#
# **The caller's permissions must be at least what this file declares.** A
# called workflow cannot request more than its caller grants, and a caller that
# grants less does not fail a step — the whole run is refused before it starts,
# as `startup_failure`, with no log to read.
#
# ---------------------------------------------------------------------------
# Trigger policy: the caller decides *when*, this workflow decides *whether*.
#
# Recording is not a test job. It runs a browser, encodes video with a software
# encoder, and takes minutes rather than seconds — this repository's `smoke`
# job is already ~8 minutes. Firing it on every push to every pull request is a
# bill nobody signed up for, so there are two gates and they are different:
#
#   1. The caller's `paths:` filter — the coarse one. Point it at the part of
#      the repository that has demos. Everything else never starts a runner.
#   2. This workflow's own discovery — the fine one. It records a storyboard
#      only when the branch changed something under the app that storyboard
#      demonstrates. A pull request that touches the app but no storyboard
#      still records; a pull request that touches neither exits in seconds.
#   3. The rehearsal (#387) — the functional one. Each selected storyboard
#      runs once before any take: same verbs, pacing zeroed, strict=True.
#      A storyboard whose feature does not work reddens the job in seconds,
#      names itself, and nothing is recorded, staged or published — because
#      the alternative is spending encoder minutes producing artifacts that
#      document a bug as if it were the demo.
#
# A label was the alternative and was rejected: it needs a human action on a
# branch that already exists, and when somebody forgets, the failure mode is
# *no video* — precisely the thing this workflow exists to eliminate. A path
# filter is automatic, and it matches the house rule that whether a change is
# demoable is decided by the author before the work starts.
#
# Add `concurrency` with `cancel-in-progress` in the caller. Ten pushes should
# cost one recording.
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      storyboards:
        description: >-
          Whitespace-separated storyboard paths to record, skipping discovery.
          Leave empty to record the storyboards this branch made stale.
        type: string
        default: ""
      storyboard-glob:
        description: Glob that finds storyboards, relative to working-directory.
        type: string
        default: "**/demos/**/record.py"
      working-directory:
        description: Directory the app and its storyboards are rooted at.
        type: string
        default: "."
      app-command:
        description: >-
          Command that starts the application, run in the background before
          recording. Leave empty for a storyboard that needs no server.
        type: string
        default: ""
      base-url:
        description: >-
          Where the app is. Exported as DEMO_VIDEO_BASE_URL and checked by the
          target guard — loopback only, unless allow-private-network-target.
        type: string
        default: "http://127.0.0.1:8000"
      ready-path:
        description: Path polled on base-url until it answers, before recording starts.
        type: string
        default: "/"
      ready-timeout-seconds:
        type: number
        default: 60
      allow-private-network-target:
        description: >-
          Permit a private or internal host (10.x, a container service name,
          *.internal), in the pre-check *and* in the recorders — it is passed
          to them as DEMO_VIDEO_ALLOW_PRIVATE, because they classify the
          target again at construction. Public hosts are refused regardless —
          there is no input that permits one. See
          skills/demo-video/scripts/demo-target-guard.
        type: boolean
        default: false
      extra-env:
        description: >-
          KEY=VALUE lines exported for the app and the storyboards. Not a place
          for secrets: everything here is visible to the storyboard, which
          renders what it is given onto a video that leaves this repository.
        type: string
        default: ""
      demo-retention-days:
        description: How long demo.mp4 stays downloadable. Set it, do not inherit it.
        type: number
        default: 30
      evidence-retention-days:
        description: >-
          How long evidence/ and frames/ stay downloadable. Long enough to
          settle a disputed finding, short enough not to be an archive.
        type: number
        default: 3
      runs-on:
        type: string
        default: ubuntu-latest
      timeout-minutes:
        type: number
        default: 25
      helper-ref:
        description: >-
          Ref of rogvid/skills the CI helper scripts come from. Ignored when
          the calling repository is rogvid/skills itself, which already has
          them in the checkout under test.
        type: string
        default: main
    outputs:
      recorded:
        description: How many storyboards were recorded.
        value: ${{ jobs.record.outputs.recorded }}
      artifact-url:
        description: Deep link to the uploaded demo artifact; empty if there was none.
        value: ${{ jobs.record.outputs.artifact-url }}

jobs:
  record:
    name: record the branch's demos
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      # `write`, not `read`, since #410: the pull-request preview is uploaded
      # as a **release asset**, and that is a write to the repository even
      # though no ref moves. `read` gave `HTTP 403: Resource not accessible by
      # integration` on the first live run.
      #
      # **A pull request from a fork cannot do this**, whatever is written
      # here: GitHub hands a fork's workflow a read-only token by design. Such
      # a run gets a block with no preview and a line saying so, which is why
      # the upload step below is allowed to fail without failing the job.
      contents: write
      pull-requests: write
      # For the ticket re-read (#276) only. A caller who does not grant it
      # gets `not checked` in the comment rather than a failed check.
      issues: read
    outputs:
      recorded: ${{ steps.discover.outputs.count }}
      artifact-url: ${{ steps.upload-demo.outputs.artifact-url }}
    env:
      # Where staged artifacts and scratch files go. Set once so no step has to
      # agree with another about a path by copying a literal.
      DEMO_DIRS: ${{ github.workspace }}/.demo-video-ci/demo-dirs.txt
      STAGE_DEMO: ${{ github.workspace }}/.demo-video-ci/demo
      STAGE_WORKING: ${{ github.workspace }}/.demo-video-ci/working
      STAGE_FAILURE: ${{ github.workspace }}/.demo-video-ci/failure
      CHANGED: ${{ github.workspace }}/.demo-video-ci/changed.txt
      STARTED_AT: ${{ github.workspace }}/.demo-video-ci/recording-started
      # The block spliced into the pull-request *body*, and the classifier's
      # verdict it is rendered from.
      PR_BLOCK: ${{ github.workspace }}/.demo-video-ci/pr-block.md
      CLASSIFY: ${{ github.workspace }}/.demo-video-ci/classification.json
      PR_BODY: ${{ github.workspace }}/.demo-video-ci/pr-body.md
      COMMITS: ${{ github.workspace }}/.demo-video-ci/commits.txt
      APP_LOG: ${{ github.workspace }}/.demo-video-ci/app.log

    steps:
      # fetch-depth: 0 because discovery diffs against the base commit, and a
      # shallow clone does not have it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The helper scripts live in this repository. When the caller *is* this
      # repository the checkout above already has them, and reaching for main
      # instead would test main's helpers against the branch's workflow.
      - uses: actions/checkout@v4
        if: github.repository != 'rogvid/skills'
        with:
          repository: rogvid/skills
          ref: ${{ inputs.helper-ref }}
          path: .demo-video-helpers
          persist-credentials: false

      # `skill=` is the demo-video skill directory in the same checkout. The
      # target guard lives there and not under .github/scripts, because it has
      # to reach a consumer who installed the skill and records by hand — CI
      # is not the only place a recording is pointed at a host. This step is
      # what keeps that a *move* rather than a copy: one file, invoked from
      # the skill by both the workflow and every storyboard.
      - name: Locate the CI helper scripts
        id: helpers
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$DEMO_DIRS")"
          if [ "$GITHUB_REPOSITORY" = "rogvid/skills" ]; then
            root="$GITHUB_WORKSPACE"
            echo "Using the helper scripts from the checkout under test."
          else
            root="$GITHUB_WORKSPACE/.demo-video-helpers"
          fi
          dir="$root/.github/scripts"
          skill="$root/skills/demo-video"
          # Packaging and some checkout paths drop the executable bit.
          chmod +x "$dir"/demo-storyboards "$dir"/demo-ticket-check
          chmod +x "$dir"/demo-classify "$dir"/demo-pr-body "$dir"/demo-preview-asset
          chmod +x "$skill"/scripts/demo-target-guard "$skill"/scripts/demo-rehearse
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "skill=$skill" >> "$GITHUB_OUTPUT"

      # Before discovery, not after: the helper scripts are PEP 723 executables
      # with a `uv run --script` shebang, so `uv` has to exist before the first
      # one is invoked. On a run with nothing to record this is the only setup
      # paid for, and with the cache warm it is a few seconds.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Work out which storyboards this branch made stale
        id: discover
        working-directory: ${{ inputs.working-directory }}
        env:
          SCRIPTS: ${{ steps.helpers.outputs.dir }}
          EXPLICIT: ${{ inputs.storyboards }}
          GLOB: ${{ inputs.storyboard-glob }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            # Two dots, not three: the checkout is the pull request's merge
            # commit, so its diff against the base is exactly the net change.
            git diff --name-only "$BASE_SHA" HEAD > "$CHANGED"
          elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
            git diff --name-only HEAD^ HEAD > "$CHANGED"
          else
            : > "$CHANGED"
          fi
          echo "Changed on this branch:"; sed 's/^/  /' "$CHANGED"

          # Diff paths are repository-relative and the script globs from
          # working-directory. Re-rooting them is --strip-prefix's job, not a
          # shell `grep`'s: the prefix test has to be anchored at a path
          # boundary or a push to `examples/ticket-queue-v2` records
          # `examples/ticket-queue`'s demos.
          "$SCRIPTS/demo-storyboards" \
            --root . --glob "$GLOB" \
            --explicit "$EXPLICIT" \
            --changed-file "$CHANGED" \
            --strip-prefix "$WORKDIR" \
            --github-output "$GITHUB_OUTPUT" > "$CHANGED.selected"

          # Every later step reads the demo directories from here, so it exists
          # even when the take never runs.
          sed 's|/[^/]*$||' "$CHANGED.selected" | sort -u > "$DEMO_DIRS"
          echo "Recording:"; sed 's/^/  /' "$DEMO_DIRS"

      # What kind of change is this, and does a reviewer need to watch it?
      # The first question somebody opening a pull request has, and answering
      # it first is what lets everything else be short.
      #
      # The verdict is a *pair*: the branch's conventional-commit types say
      # what kind of change it is, the touched paths say whether there is
      # anything to see. That is the demoable/not-demoable table in this
      # repository's own guide, applied — either half can veto a demo, and only
      # both together ask for one. A `perf:` touching nothing but `tests/` gets
      # no video.
      #
      # Never fatal, by construction: an unrecognised type or a path set it has
      # no rule for resolves to "no demo, and here is why". A classifier that
      # stopped a pull request would be worse than the wall of text it replaces.
      - name: Classify the change
        id: classify
        if: steps.discover.outputs.count != '0'
        env:
          SCRIPTS: ${{ steps.helpers.outputs.dir }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY_TEXT: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git log --format=%s "$BASE_SHA..HEAD" > "$COMMITS"
          else
            git log --format=%s -1 > "$COMMITS"
          fi
          # The author's override lives in the body, so the body is an input.
          printf '%s\n' "$PR_BODY_TEXT" > "$PR_BODY"
          "$SCRIPTS/demo-classify" \
            --commits "$COMMITS" --changed-file "$CHANGED" \
            --pr-body "$PR_BODY" --json > "$CLASSIFY"
          cat "$CLASSIFY"
          demo=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['demo'])" "$CLASSIFY")
          echo "demo=$demo" >> "$GITHUB_OUTPUT"
          # `none` does not skip the take — it makes it a stills-only one.
          # ~2 s against minutes, and it keeps *evidence*: a `refactor:` that
          # changes what a viewer sees is exactly the case the commit type gets
          # wrong, and pictures are what make that visible to anyone who looks.
          if [ "$demo" = "none" ]; then
            echo "DEMO_VIDEO_STILLS_ONLY=1" >> "$GITHUB_ENV"
            echo "category says nothing to watch -> recording stills only"
          fi

      - name: Nothing to record
        if: steps.discover.outputs.count == '0'
        run: |
          echo "No storyboard on this branch needs re-recording." | tee -a "$GITHUB_STEP_SUMMARY"

      # ---- everything below runs only when there is something to record ----

      - name: Refuse a target that could be production
        if: steps.discover.outputs.count != '0'
        working-directory: ${{ inputs.working-directory }}
        env:
          SKILL: ${{ steps.helpers.outputs.skill }}
          BASE_URL: ${{ inputs.base-url }}
          ALLOW_PRIVATE: ${{ inputs.allow-private-network-target }}
          EXTRA_ENV: ${{ inputs.extra-env }}
        run: |
          set -euo pipefail
          args=(--url "$BASE_URL")
          if [ "$ALLOW_PRIVATE" = "true" ]; then args+=(--allow-private); fi
          while IFS= read -r sb; do
            if [ -n "$sb" ]; then args+=(--scan "$sb"); fi
          done < "$CHANGED.selected"
          # extra-env is where a second URL hides — a storyboard that reads
          # its own variable would otherwise route around base-url entirely.
          printf '%s\n' "$EXTRA_ENV" > "$CHANGED.env"
          args+=(--scan "$CHANGED.env")
          "$SKILL/scripts/demo-target-guard" "${args[@]}"

      - name: Export the caller's extra environment
        if: steps.discover.outputs.count != '0' && inputs.extra-env != ''
        env:
          EXTRA_ENV: ${{ inputs.extra-env }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "$line" >> "$GITHUB_ENV"
              echo "exported ${line%%=*}"
            fi
          done <<< "$EXTRA_ENV"

      # Chromium is ~170 MB and re-downloading it on every pull request is the
      # single biggest avoidable cost in this job. The key carries the resolved
      # Playwright version so a version bump gets a fresh browser rather than a
      # stale one that will not launch.
      - name: Resolve the Playwright version the storyboards will get
        if: steps.discover.outputs.count != '0'
        id: pw
        run: |
          set -euo pipefail
          # `playwright.__version__` does not exist — the package exposes its
          # version only through the distribution metadata.
          v=$(uv run --no-project --with playwright python -c \
                'from importlib.metadata import version; print(version("playwright"))')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Playwright $v"

      - name: Cache the Chromium build
        if: steps.discover.outputs.count != '0'
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install ffmpeg and Chromium
        if: steps.discover.outputs.count != '0'
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo "ffmpeg already present: $(ffmpeg -version | head -1)"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          # On a cache hit this skips the browser download; the system
          # libraries are not cacheable and are installed either way.
          echo "browser cache hit: ${{ steps.browser-cache.outputs.cache-hit || 'false' }}"
          uv run --no-project --with playwright playwright install --with-deps chromium

      - name: Start the application
        if: steps.discover.outputs.count != '0' && inputs.app-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          APP_COMMAND: ${{ inputs.app-command }}
        run: |
          set -euo pipefail
          nohup bash -c "$APP_COMMAND" > "$APP_LOG" 2>&1 &
          echo "started: $APP_COMMAND (pid $!)"

      - name: Wait for the application
        if: steps.discover.outputs.count != '0' && inputs.app-command != ''
        env:
          URL: ${{ inputs.base-url }}${{ inputs.ready-path }}
          DEADLINE: ${{ inputs.ready-timeout-seconds }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 "$DEADLINE"); do
            if curl -fsS -o /dev/null "$URL"; then echo "$URL is up"; exit 0; fi
            sleep 1
          done
          echo "::error::$URL never answered in ${DEADLINE}s"
          echo "--- app log ---"; cat "$APP_LOG" || true
          exit 1

      # The functional gate (#387), before a single encoder minute is spent.
      # Every selected storyboard runs once as a rehearsal — the same
      # storyboard, pacing zeroed, no video, strict=True — and one that fails
      # is not recorded: the job reddens here in seconds naming the file,
      # nothing is staged or published, and no take exists to document a bug
      # as if it were the demo. It exports the same target facts the Record
      # step does, for the same reason that step does: the recorder classifies
      # its target again at construction, and WorkflowGates (tests/ci-unit)
      # holds the two steps to the same facts. A storyboard whose app is fine
      # costs its rehearsal seconds; that is the whole price of never encoding
      # a broken feature.
      - name: Rehearse
        id: rehearse
        if: steps.discover.outputs.count != '0'
        working-directory: ${{ inputs.working-directory }}
        env:
          SKILL: ${{ steps.helpers.outputs.skill }}
          DEMO_VIDEO_BASE_URL: ${{ inputs.base-url }}
          DEMO_VIDEO_ALLOW_PRIVATE: ${{ inputs.allow-private-network-target }}
          DEMO_VIDEO_SPEECH: "0"
        run: |
          set -uo pipefail
          status=ok
          rehearsed=0
          # fd 3, not stdin — `uv run` drains stdin, which ate every
          # storyboard after the first until the Record step learned this.
          while IFS= read -r sb <&3; do
            [ -n "$sb" ] || continue
            rehearsed=$((rehearsed + 1))
            echo "::group::rehearse $sb"
            if ! "$SKILL/scripts/demo-rehearse" "$sb" < /dev/null; then
              echo "::error file=$sb::rehearsal failed — the feature does not work as the storyboard drives it; no take was recorded"
              status=failed
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
          done 3< "$CHANGED.selected"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "rehearsal status: $status ($rehearsed storyboard(s) rehearsed)"

      # The take is allowed to fail here. What it left behind is the point of
      # every step after this one, so the job is failed at the very end instead.
      - name: Record
        if: steps.discover.outputs.count != '0' && steps.rehearse.outputs.status == 'ok'
        id: record
        working-directory: ${{ inputs.working-directory }}
        env:
          DEMO_VIDEO_BASE_URL: ${{ inputs.base-url }}
          # The recorders classify the target again, in `__init__`, with the
          # same rules the guard step ran. So they need the same answer to the
          # same question: without this line `allow-private-network-target:
          # true` passed the pre-check and then raised `TargetRefused` one
          # browser download later. `_env_flag` reads the `true`/`false` a
          # boolean input renders as. `WorkflowGates` in tests/ci-unit is what
          # keeps the two steps saying the same thing.
          DEMO_VIDEO_ALLOW_PRIVATE: ${{ inputs.allow-private-network-target }}
          DEMO_VIDEO_SPEECH: "0"
        run: |
          set -uo pipefail
          # Every artifact staged later must be newer than this. `images/`,
          # `timeline.json` and `timeline.md` are *committed* files, so they
          # are sitting in the checkout before anything records — and staging
          # them unconditionally publishes the previous recording under this
          # take's name. See the freshness check in "Stage the artifacts".
          touch "$STARTED_AT"
          status=ok
          ran=0
          # The loop reads its list on fd 3, not stdin. `uv run` inherits stdin
          # and drains it, so with the ordinary `done < file` the *first*
          # storyboard swallowed the rest of the list: two were selected, one
          # was recorded, and nothing said so. The second demo's committed
          # artifacts were then the only thing left on disk to publish.
          while IFS= read -r sb <&3; do
            [ -n "$sb" ] || continue
            ran=$((ran + 1))
            echo "::group::uv run $sb"
            if ! uv run "$sb" < /dev/null; then
              echo "::error file=$sb::the take did not finish — see failure/ in the artifacts"
              status=failed
            fi
            echo "::endgroup::"
          done 3< "$CHANGED.selected"

          # A loop that silently runs fewer storyboards than were selected is
          # exactly the bug above, and it is invisible in the artifacts: what
          # is missing looks like what was never asked for.
          expected=$(grep -c . "$CHANGED.selected")
          if [ "$ran" -ne "$expected" ]; then
            echo "::error::selected $expected storyboard(s) but ran $ran"
            status=failed
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "record status: $status ($ran of $expected storyboards run)"

      # `steps.record.conclusion != 'skipped'` is load-bearing, not belt and
      # braces. `images/`, `timeline.json` and `timeline.md` are *committed*
      # files: they are in the checkout before anything records. Without this
      # condition, a job that died during setup staged the previous
      # recording's artifacts and posted a comment with full beat tables and a
      # duration — a confident, entirely wrong claim that a demo had been
      # recorded. That happened on the first real run of this workflow.
      - name: Stage the artifacts
        if: always() && steps.discover.outputs.count != '0' && steps.record.conclusion != 'skipped'
        id: stage
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          rm -rf "$STAGE_DEMO" "$STAGE_WORKING" "$STAGE_FAILURE"
          mkdir -p "$STAGE_DEMO" "$STAGE_WORKING" "$STAGE_FAILURE"
          stale=0
          silent=0
          # Second line of defence, independent of the step condition above:
          # nothing older than the moment recording began may be published.
          # A take that crashed before rewriting a file leaves the committed
          # one in place, and it is indistinguishable by content.
          fresh() { [ -e "$1" ] && [ "$1" -nt "$STARTED_AT" ]; }
          copy_fresh() {
            if fresh "$1"; then
              cp "$1" "$2"
            elif [ -e "$1" ]; then
              echo "::warning file=$1::not written by this take — left out of the artifacts"
              stale=$((stale + 1))
            fi
          }
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            # What a human watches, and what stays readable after the video is
            # gone. `demo-video-FAILED.md` travels with it deliberately: it is
            # the file that says whether the mp4 beside it is this take's.
            mkdir -p "$STAGE_DEMO/$dir"
            for f in demo.mp4 timeline.md timeline.json demo-video-FAILED.md; do
              copy_fresh "$dir/$f" "$STAGE_DEMO/$dir/$f"
            done
            # `timeline.json` is the file that decides whether this demo said
            # anything at all this run: the comment is rendered from it, and
            # without one the demo is reported as having published nothing.
            # Counted separately from `stale` because a held-back *still* is
            # ordinary — a storyboard that dropped a `shot()` leaves its
            # committed png behind — and must not turn the check red on its own.
            if [ ! -f "$STAGE_DEMO/$dir/timeline.json" ]; then
              echo "::error file=$dir::published no timeline.json this run wrote"
              silent=$((silent + 1))
            fi
            if [ -d "$dir/images" ]; then
              mkdir -p "$STAGE_DEMO/$dir/images"
              for img in "$dir"/images/*; do
                copy_fresh "$img" "$STAGE_DEMO/$dir/images/$(basename "$img")"
              done
            fi
            # Short retention: enough to check a disputed finding, not an archive.
            # Regenerated wholesale by every take, so no committed copy exists
            # to go stale and a directory copy is safe.
            for sub in evidence frames; do
              if [ -d "$dir/$sub" ]; then
                mkdir -p "$STAGE_WORKING/$dir"
                cp -r "$dir/$sub" "$STAGE_WORKING/$dir/$sub"
              fi
            done
            if [ -d "$dir/failure" ]; then
              mkdir -p "$STAGE_FAILURE/$dir"
              cp -r "$dir/failure" "$STAGE_FAILURE/$dir/failure"
            fi
          done < "$DEMO_DIRS"
          bytes=$(find "$STAGE_DEMO" -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          {
            echo "bytes=$bytes"
            echo "stale=$stale"
            echo "silent=$silent"
          } >> "$GITHUB_OUTPUT"
          echo "staged $bytes bytes ($stale file(s) held back as not this take's, $silent demo(s) published no timeline):"
          find "$STAGE_DEMO" -type f | sed "s|$STAGE_DEMO/|  |"

      - name: Upload the recording
        if: always() && steps.discover.outputs.count != '0' && steps.record.conclusion != 'skipped'
        id: upload-demo
        uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: ${{ github.workspace }}/.demo-video-ci/demo
          if-no-files-found: warn
          retention-days: ${{ inputs.demo-retention-days }}

      - name: Upload the working files a finding can be checked against
        if: always() && steps.discover.outputs.count != '0' && steps.record.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: demo-video-working-files
          path: ${{ github.workspace }}/.demo-video-ci/working
          if-no-files-found: ignore
          retention-days: ${{ inputs.evidence-retention-days }}

      - name: Upload the failure dump
        if: always() && steps.discover.outputs.count != '0' && steps.record.outputs.status != 'ok'
        id: upload-failure
        uses: actions/upload-artifact@v4
        with:
          name: demo-video-failure
          path: ${{ github.workspace }}/.demo-video-ci/failure
          if-no-files-found: warn
          retention-days: ${{ inputs.evidence-retention-days }}

      # Did the ticket move under the storyboard? Each staged timeline.json
      # names the ticket its clauses were copied out of (#275); the take
      # itself never fetches it, so this step — outside the take — re-reads
      # the issue and writes review/ticket-check.json beside the staged
      # timeline for the comment step below to render (#276). Never fatal:
      # a reworded issue is not a broken demo, and a check that reddens
      # because somebody fixed a typo in the ticket teaches people to ignore
      # it. The script exits 0 on every path; whatever it could not read it
      # reports as `not checked`, with the reason, in the sidecar.
      - name: Re-read the ticket each demo names
        if: always() && steps.discover.outputs.count != '0' && steps.record.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS: ${{ steps.helpers.outputs.dir }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r dir; do
            if [ -n "$dir" ]; then args+=(--demo "$dir"); fi
          done < "$DEMO_DIRS"
          "$SCRIPTS/demo-ticket-check" "${args[@]}" --demo-root "$STAGE_DEMO"

      # **Decided once, here.** The preview and the acceptance clauses must
      # describe the same take, and on the second live run they did not: the
      # upload loop kept whichever demo it processed last while the block chose
      # by clause count, and with two demos tied at four clauses the block
      # paired this change's video with another demo's checklist. A reviewer
      # would have ticked search criteria while watching an assign video, which
      # is the artifact lying to its reader.
      #
      # One decision, read by both steps below, is the only shape in which that
      # cannot happen again.
      - name: Choose the demo the block describes
        id: pick
        if: >-
          always() && steps.discover.outputs.count != '0' &&
          steps.record.conclusion != 'skipped'
        working-directory: ${{ inputs.working-directory }}
        env:
          SCRIPTS: ${{ steps.helpers.outputs.dir }}
          # `$CHANGED` holds repository-relative paths and the demo names are
          # relative to working-directory. Without this they never match and
          # the "a storyboard this branch touched wins" rule silently never
          # fires — #274's shape, one script over.
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          args=(--classification "$CLASSIFY" --pick-only)
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            args+=(--demo "$dir")
          done < "$DEMO_DIRS"
          demo=$("$SCRIPTS/demo-pr-body" "${args[@]}" \
            --demo-root "$STAGE_DEMO" --changed-file "$CHANGED" \
            --path-prefix "$WORKDIR")
          echo "demo=$demo" >> "$GITHUB_OUTPUT"
          echo "the block will describe: $demo"

      # The preview a pull-request body can actually show. GitHub has no public
      # API for the attachment upload its drag-and-drop uses, so a video cannot
      # reach a reviewer as a player — only as an inline image, and an animated
      # WebP is one. It is uploaded as a **release asset**, which is not a git
      # object: nothing is committed and the repository does not grow.
      #
      # Skipped on a stills-only take, which wrote no preview by construction.
      - name: Upload the preview
        id: preview
        if: >-
          always() && steps.discover.outputs.count != '0' &&
          steps.record.conclusion != 'skipped' &&
          steps.classify.outputs.demo != 'none' &&
          github.event.pull_request.number
        working-directory: ${{ inputs.working-directory }}
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS: ${{ steps.helpers.outputs.dir }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PICKED: ${{ steps.pick.outputs.demo }}
        # A preview is a convenience; the recording is the deliverable. An
        # upload that fails — a fork's read-only token, a transient 5xx —
        # leaves the block saying the video was not recorded, which is true
        # and readable, rather than reddening a job whose take succeeded.
        continue-on-error: true
        run: |
          set -uo pipefail
          url=""
          # **Only the demo the pick step chose.** Looping over every demo and
          # keeping the last url is what paired one demo's video with another
          # demo's checklist on the second live run.
          dir="$PICKED"
          # Named by the **staged** timeline, not by a glob and not by the
          # working tree's copy. Staging is where the freshness filter ran, so
          # only a timeline this run wrote can name a preview — the same rule
          # that stops a previous recording being published as this one's
          # (#20). A take that wrote no preview names none.
          name=""
          if [ -n "$dir" ]; then
            name=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('preview') or '')" "$STAGE_DEMO/$dir/timeline.json" 2>/dev/null || true)
          fi
          if [ -n "$name" ] && [ -f "$dir/$name" ]; then
            url=$("$SCRIPTS/demo-preview-asset" upload \
              --file "$dir/$name" --pr "$PR" --demo "$dir" \
              --sha "$HEAD_SHA" --repo "$REPO")
            echo "uploaded $dir/$name -> $url"
          else
            echo "no preview for ${dir:-<no demo chosen>}"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The block a reviewer reads first, rendered and spliced into the
      # pull-request *body* in one step.
      #
      # This replaces the comment this workflow used to post, which carried
      # every caption, every acceptance message and every diagnostic below the
      # fold of a conversation tab. Those artifacts still exist and are still
      # uploaded; they belong behind the link at the foot of the block, for the
      # reviewer who has a question, not in front of the one who does not.
      #
      # `--existing-body` splices between markers, so everything the author
      # wrote is untouched and ten pushes rewrite one block rather than
      # stacking ten comments. The body is re-read here rather than reused
      # from the classify step: a human may have edited it since, and splicing
      # into a stale copy would silently revert them.
      - name: Update the pull-request body
        if: >-
          always() && steps.discover.outputs.count != '0' &&
          steps.record.conclusion != 'skipped' &&
          github.event.pull_request.number
        working-directory: ${{ inputs.working-directory }}
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPTS: ${{ steps.helpers.outputs.dir }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SUMMARY: ${{ github.event.pull_request.title }}
          PICKED: ${{ steps.pick.outputs.demo }}
          # Where the --demo paths sit in the repository. They are relative to
          # working-directory, so a still linked without this is a 404 that
          # looks exactly like a working link (#274).
          WORKDIR: ${{ inputs.working-directory }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR" --jq '.body // ""' > "$PR_BODY"
          # Every recorded demo is handed over; `demo-pr-body` picks the one
          # with the most declared acceptance clauses. A change under an app
          # root makes every storyboard of that app stale — the first live run
          # recorded seven — so taking the first directory meant taking the
          # alphabetically first, which chose a demo with no criteria and
          # rendered an empty checklist while the demo with four went
          # unmentioned. The choice is in Python because it is a rule worth a
          # test, not a line of shell.
          args=(--classification "$CLASSIFY" --summary "$SUMMARY")
          # The one demo the pick step chose — not the list again. Re-deriving
          # it here would be a second implementation of the same decision, and
          # the two disagreeing is exactly the bug this replaced.
          if [ -n "$PICKED" ]; then args+=(--demo "$PICKED"); fi
          if [ -n "$PREVIEW_URL" ]; then args+=(--video-url "$PREVIEW_URL"); fi
          "$SCRIPTS/demo-pr-body" "${args[@]}" \
            --demo-root "$STAGE_DEMO" \
            --path-prefix "$WORKDIR" --repo-url "$REPO_URL" \
            --sha "$HEAD_SHA" --details-url "$RUN_URL" \
            --existing-body "$PR_BODY" --out "$PR_BLOCK"
          cat "$PR_BLOCK"
          gh api -X PATCH "repos/$REPO/pulls/$PR" -F body=@"$PR_BLOCK" --jq .html_url

      - name: Fail the check if the take failed
        if: >-
          always() && steps.discover.outputs.count != '0' &&
          (steps.record.outputs.status != 'ok' || steps.stage.outputs.silent != '0')
        run: |
          echo "::error::A take did not finish, or a selected demo published nothing this run wrote."
          echo "::error::The recording, the beat log and failure/ are attached to this run."
          exit 1

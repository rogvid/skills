name: CI

# **One job.** This repository is a set of skills, not a service, and the
# checks that used to live here - lint, typecheck, two unit suites, their
# fault-injection drivers, actionlint, and the smoke recorder - all answer
# questions their author can ask when they want the answer. They are still
# here, in `tests/`, behind `mise run check` and the tasks `mise tasks` lists.
# What changed is who decides when they run.
#
# A leaked credential is the exception: it is the one failure that cannot be
# undone by running something later, so it is the one thing that still runs
# without being asked.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # **Read as text, not used by any step here.** `tests/lint` and
  # `tests/typecheck` parse these two lines out of this file so the repo has
  # exactly one pin per tool and a local run is the pinned version - issue #189
  # is what a second pin cost. Both scripts refuse a missing, duplicated or
  # unpinned line, so deleting this block breaks them; change a version here.
  RUFF_VERSION: "0.16.1"
  MYPY_VERSION: "1.18.2"

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # What gitleaks scans depends on the event: for `pull_request` it is the
      # commits in the PR, for `push` the pushed range, and only for a manual
      # or scheduled run is it the whole repository. fetch-depth: 0 is what
      # makes that last case possible — without it a full scan has no history
      # to read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Config is .gitleaks.toml at the repo root: the default ruleset plus one
      # narrow path allowlist for vendored xterm.js.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

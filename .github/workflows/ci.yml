name: CI

# One job: gitleaks. A leaked credential is the one failure that cannot be
# undone by running something later. Everything else is a `mise` task.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # What gitleaks scans depends on the event: for `pull_request` it is the
      # commits in the PR, for `push` the pushed range, and only for a manual
      # or scheduled run is it the whole repository. fetch-depth: 0 is what
      # makes that last case possible — without it a full scan has no history
      # to read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Config is .gitleaks.toml at the repo root: the default ruleset plus one
      # narrow path allowlist for vendored xterm.js.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

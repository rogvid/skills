target-version = "py310"  # the floor the skills' PEP 723 headers declare
line-length = 100
exclude = ["skills/demo-video/helpers/assets"]  # vendored xterm.js
extend-include = [
    "skills/*/scripts/*",  # every skill's PEP 723 executables
    "examples/*/serve",
    "examples/*/tickets",
    "examples/*/test",
]

[lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]

[format]
exclude = ["*.md"]
